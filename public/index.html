<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Halal Finder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --linen: #FAF6EF;
    --linen-deep: #F1EADA;
    --basil: #1F3D2B;
    --basil-soft: #2E5240;
    --saffron: #E3A008;
    --sumac: #C1443C;
    --clay: #8C7A6B;
    --mint: #3F7D58;
    --paper-line: #DCD2BE;
    --shadow: 0 1px 0 rgba(31,61,43,0.06);
    --radius: 4px;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    background: var(--linen);
    color: var(--basil);
    font-family: 'Public Sans', sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  body {
    background-image:
      radial-gradient(circle at 1px 1px, rgba(31,61,43,0.05) 1px, transparent 0);
    background-size: 22px 22px;
  }

  #app { min-height: 100vh; padding-bottom: 80px; }

  .eyebrow {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--clay);
  }

  h1, h2, h3 {
    font-family: 'Fraunces', serif;
    margin: 0;
    color: var(--basil);
    letter-spacing: -0.01em;
  }

  /* ---------- Top bar ---------- */
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 22px 28px;
    border-bottom: 1px solid var(--paper-line);
    background: var(--linen);
    position: sticky;
    top: 0;
    z-index: 20;
  }
  .brand { display: flex; align-items: center; gap: 10px; cursor: pointer; }
  .brand-mark {
    width: 34px; height: 34px;
    border-radius: 50%;
    background: var(--basil);
    display: flex; align-items: center; justify-content: center;
    color: var(--linen);
  }
  .brand-name { font-family: 'Fraunces', serif; font-weight: 600; font-size: 20px; }
  .user-chip {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    padding: 8px 14px;
    border: 1px solid var(--basil);
    border-radius: 999px;
    cursor: pointer;
    background: transparent;
    color: var(--basil);
    transition: background .15s ease;
  }
  .user-chip:hover { background: var(--linen-deep); }

  .wrap { max-width: 880px; margin: 0 auto; padding: 0 28px; }

  .back-row {
    display: flex; align-items: center; gap: 10px;
    margin: 28px 0 6px;
    cursor: pointer;
    color: var(--clay);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    width: fit-content;
  }
  .back-row:hover { color: var(--basil); }

  /* ---------- Home / category ticket stubs ---------- */
  .hero { padding: 56px 0 20px; }
  .hero h1 { font-size: 40px; line-height: 1.05; max-width: 520px; }
  .hero p { color: var(--clay); margin-top: 12px; max-width: 460px; font-size: 15px; }

  .stub-list { display: flex; flex-direction: column; gap: 16px; margin: 28px 0 50px; }

  .stub {
    position: relative;
    display: flex;
    align-items: center;
    gap: 20px;
    background: #fff;
    border: 1px solid var(--paper-line);
    border-radius: var(--radius);
    padding: 22px 26px;
    cursor: pointer;
    box-shadow: var(--shadow);
    transition: transform .12s ease, box-shadow .12s ease;
  }
  .stub:hover { transform: translateY(-2px); box-shadow: 0 8px 18px rgba(31,61,43,0.08); }

  .stub::after {
    content: "";
    position: absolute;
    right: 108px; top: -1px; bottom: -1px;
    width: 0;
    border-left: 2px dashed var(--paper-line);
  }
  .stub-icon {
    width: 52px; height: 52px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .stub-body { flex: 1; }
  .stub-body .eyebrow { margin-bottom: 4px; }
  .stub-body h3 { font-size: 21px; }
  .stub-body p { margin: 4px 0 0; color: var(--clay); font-size: 13px; }
  .stub-count {
    width: 108px;
    text-align: center;
    font-family: 'IBM Plex Mono', monospace;
  }
  .stub-count .num { font-size: 22px; font-weight: 600; display: block; }
  .stub-count .lbl { font-size: 10px; color: var(--clay); text-transform: uppercase; letter-spacing: .08em; }

  /* ---------- Section header ---------- */
  .section-head { margin: 28px 0 18px; }
  .section-head h2 { font-size: 28px; }

  input[type="text"], input[type="search"], input[type="url"], input[type="email"] {
    width: 100%;
    font-family: 'Public Sans', sans-serif;
    font-size: 14px;
    padding: 12px 14px;
    border: 1px solid var(--paper-line);
    border-radius: var(--radius);
    background: #fff;
    color: var(--basil);
    margin-bottom: 18px;
  }
  input.maps-input {
    padding: 18px 18px;
    font-size: 16px;
    min-height: 56px;
    border-width: 1.5px;
  }
  input.maps-input:focus { border-color: var(--basil); }
  input:focus, textarea:focus, select:focus { outline: 2px solid var(--basil); outline-offset: 1px; }

  /* ---------- City list ---------- */
  .city-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 4px;
    border-bottom: 1px dashed var(--paper-line);
    cursor: pointer;
  }
  .city-row:hover .city-name { color: var(--sumac); }
  .city-name { font-family: 'Fraunces', serif; font-size: 18px; transition: color .12s ease; }
  .city-meta { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--clay); }

  .empty-state {
    padding: 40px 0; color: var(--clay); font-size: 14px;
    border-top: 1px dashed var(--paper-line); margin-top: 8px;
  }
  .empty-state a { color: var(--sumac); font-weight: 600; cursor: pointer; }

  /* ---------- Place cards (ticket) ---------- */
  .ticket-grid { display: flex; flex-direction: column; gap: 14px; margin-top: 10px; }

  .ticket {
    position: relative;
    display: flex;
    background: #fff;
    border: 1px solid var(--paper-line);
    border-radius: var(--radius);
    overflow: hidden;
    cursor: pointer;
    box-shadow: var(--shadow);
  }
  .ticket:hover { box-shadow: 0 8px 18px rgba(31,61,43,0.08); }

  .ticket-main { flex: 1; padding: 20px 22px; }
  .ticket-main h3 { font-size: 19px; }
  .ticket-addr { color: var(--clay); font-size: 13px; margin-top: 4px; }
  .ticket-addr a { color: var(--clay); text-decoration: none; }
  .ticket-addr a:hover { color: var(--sumac); text-decoration: underline; }

  .stamp {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.09em;
    text-transform: uppercase;
    display: inline-block;
    margin-top: 12px;
    padding: 5px 10px;
    border: 1.5px dashed currentColor;
    border-radius: 999px;
    transform: rotate(-2deg);
  }
  .stamp.certified { color: var(--mint); }
  .stamp.community { color: #2E6B8C; }
  .stamp.self { color: var(--saffron); }

  .ticket-notch {
    width: 0;
    border-left: 2px dashed var(--paper-line);
    margin: 14px 0;
  }

  .ticket-score {
    width: 88px;
    flex-shrink: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 4px;
    font-family: 'IBM Plex Mono', monospace;
  }
  .ticket-score .heart { color: var(--sumac); font-size: 20px; }
  .ticket-score .score { font-weight: 600; font-size: 16px; }

  /* ---------- Detail / certificate ---------- */
  .certificate {
    background: #fff;
    border: 1px solid var(--paper-line);
    border-radius: 6px;
    padding: 36px;
    margin-top: 20px;
    box-shadow: 0 10px 26px rgba(31,61,43,0.06);
  }
  .cert-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 20px; }
  .cert-top h2 { font-size: 30px; }
  .cert-cat { color: var(--clay); font-size: 13px; margin-top: 6px; }

  .big-stamp {
    width: 92px; height: 92px;
    border-radius: 50%;
    border: 2.5px dashed currentColor;
    display: flex; align-items: center; justify-content: center;
    text-align: center;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    transform: rotate(6deg);
    flex-shrink: 0;
    padding: 6px;
  }
  .big-stamp.certified { color: var(--mint); }
  .big-stamp.community { color: #2E6B8C; }
  .big-stamp.self { color: var(--saffron); }

  .cert-divider { border-top: 1px dashed var(--paper-line); margin: 26px 0; }

  .cert-row { display: flex; gap: 14px; padding: 10px 0; font-size: 14px; }
  .cert-row .k { width: 130px; flex-shrink: 0; color: var(--clay); font-family: 'IBM Plex Mono', monospace; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; padding-top: 2px; }
  .cert-row .v a { color: var(--basil); text-decoration: underline; }
  .cert-row .v a:hover { color: var(--sumac); }

  .vote-box {
    margin-top: 26px;
    padding: 22px;
    background: var(--linen-deep);
    border-radius: var(--radius);
  }
  .vote-box h3 { font-size: 16px; }
  .vote-score-line { display: flex; align-items: center; gap: 8px; margin: 8px 0 16px; font-family: 'IBM Plex Mono', monospace; color: var(--sumac); font-weight: 600; }
  .vote-buttons { display: flex; gap: 10px; flex-wrap: wrap; }

  button {
    font-family: 'Public Sans', sans-serif;
    font-weight: 600;
    font-size: 13px;
    cursor: pointer;
    border-radius: 999px;
    border: 1.5px solid var(--basil);
    padding: 11px 18px;
    background: transparent;
    color: var(--basil);
    transition: background .12s ease, color .12s ease;
  }
  button:hover { background: var(--basil); color: var(--linen); }
  button.primary { background: var(--basil); color: var(--linen); }
  button.primary:hover { background: var(--basil-soft); }
  button.confirm.active { background: var(--mint); border-color: var(--mint); color: #fff; }
  button.dispute.active { background: var(--sumac); border-color: var(--sumac); color: #fff; }

  /* ---------- Submit form ---------- */
  .field { margin-bottom: 18px; }
  .field label {
    display: block;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: .07em;
    color: var(--clay);
    margin-bottom: 7px;
  }
  textarea {
    width: 100%; font-family: 'Public Sans', sans-serif; font-size: 14px;
    padding: 12px 14px; border: 1px solid var(--paper-line); border-radius: var(--radius);
    resize: vertical; min-height: 80px; background: #fff; color: var(--basil);
  }
  select {
    width: 100%; font-family: 'Public Sans', sans-serif; font-size: 14px;
    padding: 12px 14px; border: 1px solid var(--paper-line); border-radius: var(--radius);
    background: #fff; color: var(--basil);
  }
  .category-picker { display: flex; gap: 10px; }
  .cat-pill {
    flex: 1; text-align: center; padding: 12px; border-radius: var(--radius);
    border: 1.5px solid var(--paper-line); cursor: pointer; font-size: 13px; font-weight: 600;
  }
  .cat-pill.selected { border-color: var(--basil); background: var(--linen-deep); }
  .checkbox-row { display: flex; align-items: center; gap: 10px; }
  .checkbox-row input { width: 17px; height: 17px; }
  .checkbox-row label { margin: 0; text-transform: none; font-family: 'Public Sans', sans-serif; font-size: 14px; color: var(--basil); }
  .confidence-desc { font-size: 12px; color: var(--clay); margin-top: 6px; }

  .toast {
    position: fixed; bottom: 26px; left: 50%; transform: translateX(-50%);
    background: var(--basil); color: var(--linen);
    padding: 13px 22px; border-radius: 999px;
    font-family: 'IBM Plex Mono', monospace; font-size: 12px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.2);
    z-index: 50;
    opacity: 0; pointer-events: none;
    transition: opacity .2s ease, transform .2s ease;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(-6px); }

  .note-banner {
    background: #FFF7E4; border: 1px dashed var(--saffron); border-radius: var(--radius);
    padding: 14px 18px; font-size: 13px; color: #6b4e05; margin: 20px 0;
  }

  /* ---------- Login ---------- */
  .login-screen {
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    padding: 24px;
  }
  .login-card {
    width: 100%; max-width: 380px;
    background: #fff;
    border: 1px solid var(--paper-line);
    border-radius: 6px;
    padding: 40px 34px;
    box-shadow: 0 10px 26px rgba(31,61,43,0.08);
    text-align: center;
  }
  .login-mark {
    width: 52px; height: 52px; border-radius: 50%;
    background: var(--basil);
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 18px;
  }
  .login-card h1 { font-size: 24px; margin-bottom: 6px; }
  .login-card p { color: var(--clay); font-size: 13px; margin: 0 0 24px; }
  .login-card .field { text-align: left; margin-bottom: 22px; }
  .login-error { color: var(--sumac); font-size: 12px; margin: -14px 0 18px; text-align: left; }
  .sign-out {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--clay);
    cursor: pointer;
    text-transform: uppercase;
    letter-spacing: .06em;
  }
  .sign-out:hover { color: var(--sumac); }
  .topbar-right { display: flex; align-items: center; gap: 14px; }

  .field-box {
    border: 1.5px solid var(--paper-line);
    border-radius: var(--radius);
    padding: 16px 16px 13px;
    text-align: center;
    background: #fff;
    margin-bottom: 16px;
    transition: border-color .12s ease;
  }
  .field-box:focus-within { border-color: var(--basil); }
  .field-box .box-label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--clay);
    margin-bottom: 7px;
  }
  .field-box input {
    border: none !important;
    text-align: center;
    font-size: 17px;
    padding: 2px 0 !important;
    margin: 0 !important;
    background: transparent !important;
    width: 100%;
  }
  .field-box input:focus { outline: none !important; }

  .verify-icon {
    width: 60px; height: 60px; border-radius: 50%;
    border: 2px dashed var(--saffron);
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 18px;
  }
  .verify-email { font-weight: 600; color: var(--basil); }
  .verify-actions { display: flex; flex-direction: column; gap: 10px; margin-top: 22px; }
  .resend-link {
    font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--clay);
    cursor: pointer; text-transform: uppercase; letter-spacing: .06em;
  }
  .resend-link:hover { color: var(--basil); }

  .comment-form { margin-top: 22px; }
  .comment-form textarea {
    width: 100%; font-family: 'Public Sans', sans-serif; font-size: 14px;
    padding: 12px 14px; border: 1px solid var(--paper-line); border-radius: var(--radius);
    resize: vertical; min-height: 64px; background: #fff; color: var(--basil);
    margin-bottom: 10px;
  }
  .comment-list { margin-top: 18px; display: flex; flex-direction: column; gap: 12px; }
  .comment-card {
    background: #fff;
    border: 1px solid var(--paper-line);
    border-radius: var(--radius);
    padding: 14px 16px;
  }
  .comment-user {
    display: inline-block;
    background: var(--mint);
    color: #fff;
    font-weight: 600;
    font-size: 11px;
    letter-spacing: .03em;
    padding: 5px 13px;
    border-radius: 999px;
    margin-bottom: 9px;
    font-family: 'IBM Plex Mono', monospace;
  }
  .comment-text { font-size: 14px; color: var(--basil); line-height: 1.5; }
  .comment-time { font-size: 11px; color: var(--clay); margin-top: 6px; font-family: 'IBM Plex Mono', monospace; display: flex; align-items: center; gap: 10px; }
  .comment-delete { cursor: pointer; text-transform: uppercase; letter-spacing: .05em; }
  .comment-delete:hover { color: var(--sumac); }
  .comment-empty { font-size: 13px; color: var(--clay); margin-top: 14px; }

  @media (max-width: 560px) {
    .topbar, .wrap { padding-left: 18px; padding-right: 18px; }
    .stub { flex-wrap: wrap; }
    .stub::after { display: none; }
    .stub-count { width: auto; margin-left: auto; }
    .ticket { flex-direction: column; }
    .ticket-notch { display: none; }
    .ticket-score { flex-direction: row; width: 100%; padding: 10px 22px 18px; }
    .cert-top { flex-direction: column; }
  }
</style>
</head>

<div id="app"></div>
<div class="toast" id="toast"></div>

/* ============================================================
   API LAYER
   Change API_BASE to your deployed backend URL, e.g.
   "https://halal-finder-api.onrender.com" — or leave as "" if
   this HTML file is served BY that same backend (see README).
   ============================================================ */
const API_BASE = "";

async function api(path, options = {}) {
  let res;
  try {
    res = await fetch(API_BASE + path, {
      headers: { "Content-Type": "application/json" },
      ...options
    });
  } catch (networkErr) {
    throw new Error("Can't reach the server. Is the backend running, and is API_BASE set correctly?");
  }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || "Something went wrong.");
  return data;
}

function findCountryForCity(city) {
  for (const [country, cities] of Object.entries(EUROPE)) {
    if (cities.includes(city)) return country;
  }
  return "";
}

function mapsUrl(p) {
  // p.address is now expected to BE a Google Maps link (validated at submit time).
  return p.address;
}

function trustColor(score) {
  if (score > 0) return '#3F7D58'; // mint — community leans confirmed
  if (score < 0) return '#C1443C'; // sumac — community leans disputed
  return '#8C7A6B'; // clay — no consensus yet
}

function isValidMapsLink(url) {
  return /^https?:\/\/(www\.)?(maps\.google\.[a-z.]+|google\.[a-z.]+\/maps|goo\.gl\/maps|maps\.app\.goo\.gl)\//i.test(url.trim());
}

/* ============================================================
   LOGIN + EMAIL VERIFICATION
   Flow: ask for email first. If it's already known, log straight in
   (no name re-entry, no re-verification). If it's new, ask for a
   name, then show the verify step.
   ============================================================ */
function renderLogin() {
  return `
    <div class="login-screen">
      <div class="login-card">
        <div class="login-mark">${icon('heart', '#FAF6EF')}</div>
        <h1>Halal Food+ Finder</h1>
        <p>Enter the community where we share Halal restaurants, supermarkets and butchers in Munich (and across Europe).</p>
        <form onsubmit="handleEmailSubmit(event)">
          <div class="field-box">
            <div class="box-label">Email</div>
            <input type="email" id="loginEmail" placeholder="you@example.com" autofocus required>
          </div>
          ${loginError ? `<div class="login-error">${loginError}</div>` : ""}
          <button type="submit" class="primary" style="width:100%;">Continue</button>
        </form>
      </div>
    </div>`;
}

async function handleEmailSubmit(e) {
  e.preventDefault();
  const email = document.getElementById("loginEmail").value.trim();
  const emailLooksValid = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
  if (!emailLooksValid) { loginError = "Enter a valid email address."; render(); return; }

  try {
    const lookup = await api(`/api/users/by-email?email=${encodeURIComponent(email)}`);
    loginError = "";
    pendingEmail = email;

    if (lookup.exists) {
      const user = lookup.user;
      state.userId = user.id;
      state.name = user.name;
      state.email = email;
      state.username = user.name;

      if (user.isEmailVerified) {
        // Known + already verified — straight in, no re-verification.
        go("home");
      } else {
        // Known but somehow never finished verifying — send back to that step.
        pendingName = user.name;
        go("verify");
      }
    } else {
      // New email — need a name before we create the account.
      go("name");
    }
  } catch (err) {
    loginError = err.message;
    render();
  }
}

function renderNameStep() {
  return `
    <div class="login-screen">
      <div class="login-card">
        <div class="login-mark">${icon('heart', '#FAF6EF')}</div>
        <h1>What's your name?</h1>
        <p>New here — we'll use this on your submissions and comments.</p>
        <form onsubmit="handleNameSubmit(event)">
          <div class="field-box">
            <div class="box-label">Name</div>
            <input type="text" id="loginName" placeholder="Your name" autofocus required>
          </div>
          ${loginError ? `<div class="login-error">${loginError}</div>` : ""}
          <button type="submit" class="primary" style="width:100%;">Continue</button>
        </form>
      </div>
    </div>`;
}

async function handleNameSubmit(e) {
  e.preventDefault();
  const name = document.getElementById("loginName").value.trim();
  if (!name) { loginError = "Enter your name."; render(); return; }

  try {
    const user = await api('/api/signup', {
      method: 'POST',
      body: JSON.stringify({ name, email: pendingEmail })
    });
    loginError = "";
    pendingName = name;
    state.userId = user.id;
    go("verify");
  } catch (err) {
    loginError = err.message;
    render();
  }
}

function renderVerify() {
  return `
    <div class="login-screen">
      <div class="login-card">
        <div class="verify-icon">${icon('heart', '#E3A008')}</div>
        <h1>One promise, one account.</h1>
        <p>I confirm this is my only account, and I pledge to help keep this community honest and trustworthy.</p>
        <div class="verify-actions">
          <button class="primary" onclick="confirmVerified()">I promise</button>
          <span class="resend-link" onclick="resendVerification()">Resend email</span>
          <span class="resend-link" onclick="go('login')">&larr; Back</span>
        </div>
      </div>
    </div>`;
}

// Checks the REAL verification status against the server — the actual
// verifying happens when the user clicks the link in their email, which
// hits /api/verify-email-link on the backend. This button just checks
// whether that's happened yet.
async function confirmVerified() {
  try {
    const lookup = await api(`/api/users/by-email?email=${encodeURIComponent(pendingEmail)}`);
    if (lookup.exists && lookup.user.isEmailVerified) {
      state.name = pendingName;
      state.email = pendingEmail;
      state.username = pendingName;
      toast("Email verified!");
      go("home");
    } else {
      toast("Not verified yet — check your inbox and click the link first.");
    }
  } catch (err) {
    toast(err.message);
  }
}

async function resendVerification() {
  try {
    const result = await api('/api/resend-verification', {
      method: 'POST',
      body: JSON.stringify({ email: pendingEmail })
    });
    if (result.alreadyVerified) {
      toast("This email is already verified — try 'I've verified — Continue'.");
    } else {
      toast("Verification email sent — check your inbox.");
    }
  } catch (err) {
    toast(err.message);
  }
}

function signOut() {
  state.email = null;
  state.name = null;
  state.userId = null;
  state.username = "Guest";
  loginError = "";
  pendingName = "";
  pendingEmail = "";
  go("login");
}

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}

function formatTimeAgo(isoLike) {
  // SQLite datetime('now') is UTC without a 'Z' suffix — add it so Date parses correctly.
  const date = new Date(isoLike.replace(" ", "T") + "Z");
  const diffMin = Math.round((Date.now() - date.getTime()) / 60000);
  if (diffMin < 1) return "just now";
  if (diffMin < 60) return `${diffMin}m ago`;
  const diffHr = Math.round(diffMin / 60);
  if (diffHr < 24) return `${diffHr}h ago`;
  return date.toLocaleDateString();
}

async function postComment(placeId) {
  if (!state.userId) { toast("Please sign in first."); return; }
  const textEl = document.getElementById("commentText");
  const text = textEl.value.trim();

  try {
    await api(`/api/places/${placeId}/comments`, {
      method: 'POST',
      body: JSON.stringify({ userId: state.userId, text })
    });
    render();
  } catch (err) {
    toast(err.message);

}

async function deleteComment(commentId) {
  if (!confirm("Delete this comment?")) return;
  try {
    await fetch(`/api/comments/${commentId}`, {
      method: 'DELETE',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ userId: state.userId })
    });
    render();
  } catch (err) {
    toast("Couldn't delete comment.");
  }
}

async function castVote(placeId, type) {
  if (!state.userId) { toast("Please sign in first."); return; }
  try {
    await api(`/api/places/${placeId}/vote`, {
      method: 'POST',
      body: JSON.stringify({ userId: state.userId, voteType: type })
    });
    render(); // re-fetches this place's fresh vote counts from the server
  } catch (err) {
    toast(err.message);
  }
}

        <div class="field">
          <label>City</label>
          <input type="text" id="f_city" list="cityOptions" value="${cityPrefill}" placeholder="Start typing… e.g. 'Mu'" autocomplete="off" required>
          <datalist id="cityOptions"></datalist>
          <div class="confidence-desc">Pick a country first, then start typing — you'll get matching city suggestions as you go.</div>
        </div>
        <div class="field"><label>Cuisine / store type / services offered</label><input type="text" id="f_details"></div>
        <div class="field">
          <label>Confidence level</label>
          <select id="f_confidence" onchange="updateConfDesc(this.value)">${confOptions}</select>
          <div class="confidence-desc" id="confDesc">${CONFIDENCE.certified.desc}</div>
        </div>
        <div class="field checkbox-row">
          <input type="checkbox" id="f_cert">
          <label for="f_cert">Certificate / verification exists</label>
        </div>
        <div class="field"><label>Notes (optional)</label><textarea id="f_notes"></textarea></div>
        <button type="submit" class="primary">Submit place</button>
      </form>
    </div>`;
}

function updateCityOptions() {
  const country = document.getElementById("f_country").value;
  const list = document.getElementById("cityOptions");
  list.innerHTML = (EUROPE[country] || []).map(c => `<option value="${c}">`).join("");
}

function selectSubmitCategory(key) {
  submitCategory = key;
  document.querySelectorAll("#catPicker .cat-pill").forEach(el => el.classList.remove("selected"));
  event.target.classList.add("selected");
}
function updateConfDesc(key) {
  document.getElementById("confDesc").textContent = CONFIDENCE[key].desc;
}

async function handleSubmit(e) {
  e.preventDefault();
  const name = document.getElementById("f_name").value.trim();
  const address = document.getElementById("f_address").value.trim();
  const country = document.getElementById("f_country").value;
  const city = document.getElementById("f_city").value.trim();
  if (!name || !address || !country || !city) return;
  if (!state.userId) { toast("Please sign in first."); return; }

  if (!isValidMapsLink(address)) {
    toast("Please paste a real Google Maps link (from Share → Copy Link).");
    return;
  }
  if (!(EUROPE[country] || []).includes(city)) {
    toast("Please pick a city from the suggestions for the selected country.");
    return;
  }

  try {
    const newPlace = await api('/api/places', {
      method: 'POST',
      body: JSON.stringify({
        name, address, city, country,
        category: submitCategory,
        details: document.getElementById("f_details").value.trim(),
        confidence: document.getElementById("f_confidence").value,
        hasCertificate: document.getElementById("f_cert").checked,
        notes: document.getElementById("f_notes").value.trim(),
        userId: state.userId
      })
    });
    toast("Submitted — thank you!");
    go("places", { category: newPlace.category, city: newPlace.city });
  } catch (err) {
    toast(err.message);
  }
}

function promptUsername() {
  const name = prompt("Your display name:", state.username);
  if (name && name.trim()) {
    state.username = name.trim();
    render();
  }
}

/* ============================================================
   RENDER DISPATCH
   ============================================================ */
async function buildView() {
  switch (state.view) {
    case "login": return renderLogin();
    case "name": return renderNameStep();
    case "verify": return renderVerify();
    case "home": return await renderHome();
    case "cities": return await renderCities();
    case "places": return await renderPlaces();
    case "detail": return await renderDetail();
    case "submit": return renderSubmit();
    default: return renderLogin();
  }
}

const PRE_AUTH_VIEWS = ["login", "name", "verify"];

async function render() {
  const app = document.getElementById("app");
  if (!state.email && !PRE_AUTH_VIEWS.includes(state.view)) state.view = "login";

  if (!PRE_AUTH_VIEWS.includes(state.view)) {
    app.innerHTML = loadingShell();
  }
  try {
    app.innerHTML = await buildView();
    if (state.view === "submit") updateCityOptions();
  } catch (err) {
    app.innerHTML = `${renderTopbar()}<div class="wrap"><div class="empty-state">Couldn't load this page: ${err.message}</div></div>`;
  }
}

render();
</script>
</body>
</html>
